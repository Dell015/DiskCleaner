[package]
name = "dc-desktop"
description = "Desktop window for DiskCleaner: pick a folder, watch the graph grow from a live scan, remove and uninstall what you pick."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "diskcleaner"
path = "src/main.rs"

[dependencies]
dc-api.workspace = true
dc-core.workspace = true
dc-quarantine.workspace = true
dc-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"

[features]
# Removing (moving into holding, restore, empty) and uninstalling apps. On in normal builds since
# the owner's tests passed (D135). The `dc-quarantine` crate itself stays off by default; a
# read-only desktop build is `npm run tauri dev -- -- --no-default-features`.
default = ["cleaning"]
cleaning = ["dc-quarantine/destructive-actions"]
# Moving an app to another drive (B11, D141). Off by default until the owner's tests on his PC
# pass: `npm run tauri dev -- -- --features moving`.
moving = ["cleaning"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[lints]
workspace = true
