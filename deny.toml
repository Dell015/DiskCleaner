# cargo-deny configuration (v2 schema).

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained (no security issue). It is a build-time macro helper pulled in
  # by the GTK bindings Tauri uses on Linux only; nothing of it ships in the Windows app (D97).
  { id = "RUSTSEC-2024-0370", reason = "build-time only, Linux GTK bindings via Tauri" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Mozilla's CSS/HTML parsing crates used by Tauri (cssparser, selectors, ...). File-level
  # copyleft: we use them unchanged, which MPL-2.0 allows inside an MIT project (D97).
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
