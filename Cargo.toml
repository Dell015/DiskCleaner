[workspace]
resolver = "2"
members = ["crates/*", "tools/fixture-gen", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Dell015/DiskCleaner"
rust-version = "1.97.0"
publish = false

# Exact pins (R1.3). Update deliberately, never by accident.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.12.0"
insta = { version = "=1.49.0", features = ["json"] }
blake3 = "=1.8.7"
tempfile = "=3.27.0"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }
rayon = "=1.12.0"
criterion = { version = "=0.8.2", default-features = false }
windows-sys = { version = "=0.61.2", default-features = false }

# Internal crates (members use `name.workspace = true`).
dc-advisor = { path = "crates/dc-advisor" }
dc-api = { path = "crates/dc-api" }
dc-attrib = { path = "crates/dc-attrib" }
dc-cli = { path = "crates/dc-cli" }
dc-core = { path = "crates/dc-core" }
dc-leftovers = { path = "crates/dc-leftovers" }
dc-mft = { path = "crates/dc-mft" }
dc-protected = { path = "crates/dc-protected" }
dc-quarantine = { path = "crates/dc-quarantine" }
dc-rules = { path = "crates/dc-rules" }
dc-scan = { path = "crates/dc-scan" }
dc-store = { path = "crates/dc-store" }
dc-winmeta = { path = "crates/dc-winmeta" }
fixture-gen = { path = "tools/fixture-gen" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Speed for everyday `cargo run` / `cargo test` (N48). Overflow checks and debug
# assertions stay ON, so tests still catch mistakes; only the optimizer is switched on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
