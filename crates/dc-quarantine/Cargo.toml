[package]
name = "dc-quarantine"
description = "Removing safely: move into a holding folder on the same drive, restore, empty after a retention time. Feature-gated (destructive-actions), off by default."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The only switch that lets DiskCleaner change files. Off by default.
destructive-actions = []

[dependencies]
dc-protected.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows-only moving checks (src/win.rs, D119): rename by handle, hidden and owner-only folders.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
