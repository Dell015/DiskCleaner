# Well-known apps that people install and later remove. A folder that is named exactly like one
# of these (after normalization) and whose app is not installed any more is evidence of a
# leftover. This list can only ADD evidence; it never lowers a risk and never overrides the
# protected list. `report_only = true` marks apps that can hold installed games or other
# data the person may want (game launchers): those are shown but never offered.
# Every entry needs examples (checked when the list is loaded).
schema = 1

[[app]]
id = "mcafee"
name = "McAfee"
names = ["McAfee", "McAfee Security", "McAfee LiveSafe", "McAfee Total Protection", "McAfee WebAdvisor", "McAfee Safe Connect", "McAfee AntiVirus Plus", "McAfee Security Scan Plus"]
app_prefixes = ["mcafee"]
report_only = false
examples_match = ['C:\ProgramData\McAfee']
examples_no_match = ['C:\ProgramData\McAfee unrelated tools']

