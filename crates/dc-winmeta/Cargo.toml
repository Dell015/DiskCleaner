[package]
name = "dc-winmeta"
description = "Windows metadata: file probe for the scanner now; installed apps and known folders now; version info and signatures later."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dc-core = { path = "../dc-core" }
dc-scan = { path = "../dc-scan" }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
fixture-gen = { path = "../../tools/fixture-gen" }
tempfile.workspace = true

[lints]
workspace = true
